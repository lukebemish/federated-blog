name: Docker Image CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Capture Commit Date
      id: capture-commit-date
      run: echo "date=$(git show -s --format=%cd --date=format:'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          lukebemish/federated-blog:${{ steps.capture-commit-date.outputs.date }}
          lukebemish/federated-blog:latest
          ghcr.io/lukebemish/federated-blog:${{ steps.capture-commit-date.outputs.date }}
          ghcr.io/lukebemish/federated-blog:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
